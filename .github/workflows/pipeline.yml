  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - name: Baixar o código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Instalar Semgrep
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep

      - name: Gerar relatório SAST
        run: |
          mkdir -p reports
          semgrep scan --config auto --json -o reports/semgrep.json . || true

      - name: Validar SAST (falha se houver achados)
        run: semgrep scan --config auto --error .

      - name: Salvar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-sast
          path: reports/semgrep.json

  dast:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - name: Baixar o código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Iniciar aplicação
        run: |
          nohup python3 -m http.server 8080 --bind 0.0.0.0 --directory . > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/ > /dev/null && exit 0
            sleep 2
          done
          cat /tmp/server.log; exit 1

      - name: Executar OWASP ZAP Baseline
        run: |
          mkdir -p reports && chmod -R a+rwX "$GITHUB_WORKSPACE"
          set +e
          docker run --rm --network host -v "$GITHUB_WORKSPACE":/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://localhost:8080 -c .zap/rules.tsv \
            -r reports/zap.html -J reports/zap.json
          code=$?
          echo "ZAP saiu com código $code (0=ok, 1=falha, 2=avisos, 3=erro)"
          # Bloqueia em falha (1) ou erro (3+); avisos (2) não bloqueiam.
          if [ "$code" -eq 1 ] || [ "$code" -ge 3 ]; then exit 1; fi

      - name: Salvar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-zap
          path: reports/zap.*
