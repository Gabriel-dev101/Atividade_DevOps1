name: Pipeline - FinanX

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Testes automatizados
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Executar testes
        run: node --test conversions.test.js

  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - name: Baixar o código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Instalar Semgrep
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep

      - name: Executar análise SAST
        run: semgrep scan --config auto --error .

  dast:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - name: Baixar o código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Iniciar aplicação com cabeçalhos de segurança
        run: |
          cat > /tmp/secure_server.py <<'PY'
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer

          class SecureHandler(SimpleHTTPRequestHandler):
              def version_string(self):
                  return "FinanX"

              def end_headers(self):
                  self.send_header("X-Frame-Options", "DENY")
                  self.send_header("X-Content-Type-Options", "nosniff")
                  self.send_header("Referrer-Policy", "strict-origin-when-cross-origin")
                  self.send_header("Permissions-Policy", "camera=(), microphone=(), geolocation=()")
                  self.send_header("Content-Security-Policy", "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.frankfurter.app; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'")
                  self.send_header("Cache-Control", "no-store")
                  super().end_headers()

          ThreadingHTTPServer(("0.0.0.0", 8080), SecureHandler).serve_forever()
          PY
          nohup python3 /tmp/secure_server.py > /tmp/server.log 2>&1 &

      - name: Aguardar aplicação iniciar
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/ > /dev/null; then
              echo "Aplicação iniciada com cabeçalhos de segurança."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/server.log
          exit 1

      - name: Executar análise DAST - OWASP ZAP
        uses: zaproxy/action-baseline@f5ca774232402c0e196ad638f66542481c0fb5cb
        with:
          target: 'http://localhost:8080'
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap_scan

